name: speedify-status

# Home lab (docker.lan):
# - External proxy network owned by Nginx Proxy Manager: nginxproxy_proxy-net
# - NPM host: speedify.lan → forward HTTP to compose service "web:80" (no SSL)
# - AdGuard rewrite: speedify.lan → docker.lan IP
# - No host port publishes; only web joins the proxy network

networks:
  app:
    driver: bridge
  proxy:
    external: true
    name: nginxproxy_proxy-net

services:
  api:
    image: ${SPEEDIFY_STATUS_API_IMAGE:-ghcr.io/mkronvold/speedify-status-api:main}
    restart: unless-stopped
    env_file:
      - ../env/api.env
    environment:
      SPEEDIFY_STATUS_API_HOST: 0.0.0.0
      SPEEDIFY_STATUS_API_PORT: 4090
    networks:
      - app
    # app-local only — no proxy net, no published ports
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ${SPEEDIFY_STATUS_WEB_IMAGE:-ghcr.io/mkronvold/speedify-status-web:main}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
      - proxy
    # NPM: speedify.lan → web:80 (http). Web nginx proxies /api and /health → api:4090.
    # Optional labels if using jwilder/nginx-proxy instead of NPM:
    #   VIRTUAL_HOST=speedify.lan
    #   VIRTUAL_PORT=80
